<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Viewer — Team X67</title>
<!--
  CAMERA VIEWER (PC browser, Chrome or Edge) - the page we use to test the camera board.

  It shows exactly the bytes that the ESP32-S3-CAM sends over USB when obstacle_camera.ino
  runs with STREAM_TO_PC = true: the raw picture, the pillar mask, the orange / blue line
  mask and the rows where the car thinks each floor line is.

  HOW TO USE
    1. Upload src/obstacle-challenge/obstacle_camera with STREAM_TO_PC = true.
    2. CLOSE the Arduino Serial Monitor (only one program can use the port).
    3. Open this file in Chrome or Edge (Web Serial is needed), press "Connect camera"
       and choose the usbmodem / COM port of the camera board.
    4. Move the mouse over the picture to read the RGB and HSV of any pixel: those are the
       numbers used to tune the colour thresholds in obstacle_camera.ino.

  PACKET (little-endian), same as obstacle_camera.ino -> sendPacket():
    4 bytes  magic 0xAA 0x55 0xC3 0x3C
    1 byte   version | 2+2 width, height | 1 flags | 1 pillar found | 1 pillar colour (1 red, 2 green)
    2x4      left, right, top, bottom of the closest pillar | 2 pixel count | 1 split | 2 fps x 10
    [only in the 37-byte header] 12 bytes: orange (found, reason, lowest row, centre row) and
                                 blue (found, reason, lowest row, centre row); row 0xFFFF = none
    W*H*2    picture, RGB565 | W*H/4 pillar mask (2 bits per pixel: 1 red, 2 green)
    [only in the 37-byte header] W*H/4 line mask (2 bits per pixel: 1 orange, 2 blue)
  The viewer detects by itself whether the camera sends the short (25-byte) or the long
  (37-byte) packet, so older and newer camera sketches both work.
-->
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 16px; background: #f6f6f6; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #151515; color: #eee; } }
  canvas { width: 640px; max-width: 100%; height: auto; image-rendering: pixelated; background: #000; border: 1px solid #888; }
  .row { margin: 8px 0; }
  button { padding: 6px 12px; margin-right: 12px; }
  label { margin-right: 14px; }
  pre { font-family: ui-monospace, monospace; white-space: pre-wrap; margin: 6px 0; }
</style>
</head>
<body>
<h2>Camera viewer (the same bytes the ESP32 sends)</h2>
<div class="row">
  <button id="connect">Connect camera</button>
  <label><input type="checkbox" id="showPicture" checked> picture</label>
  <label><input type="checkbox" id="showMask" checked> pillar mask</label>
  <label><input type="checkbox" id="showLines" checked> line mask (orange / blue)</label>
  <label><input type="checkbox" id="showIgnore" checked> IGNORED rows</label>
</div>
<div class="row"><canvas id="cv" width="320" height="240"></canvas></div>
<pre id="info">Close the Serial Monitor before connecting. Use Chrome or Edge.</pre>
<pre id="lines"></pre>
<pre id="pix">Move the mouse over the picture to read the RGB and HSV of a pixel.</pre>

<script>
const W = 320, H = 240;
const PIC = W * H * 2, MASK = W * H / 4;
const HDR_SHORT = 25, HDR_LONG = 37;
const MAGIC = [0xAA, 0x55, 0xC3, 0x3C];

// Same numbers as obstacle_camera.ino: pillars are searched only in rows IGNORE_TOP_ROWS .. H - NEAR_ROWS - 1
const IGNORE_TOP_ROWS = 115, NEAR_ROWS = 0;
// Floor lines are searched from this row down (LINE_TOP_ROW in obstacle_camera.ino)
const LINE_TOP_ROW = 140;
const REASON = ['yes', 'no', 'no (few pixels)', 'no (too short)', 'no (too thick)', 'no (wall above)'];

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const img = ctx.createImageData(W, H);
const showPicture = document.getElementById('showPicture');
const showMask = document.getElementById('showMask');
const showLines = document.getElementById('showLines');
const showIgnore = document.getElementById('showIgnore');
const info = document.getElementById('info');
const linesInfo = document.getElementById('lines');
const pix = document.getElementById('pix');

let port = null, reader = null;
let buf = new Uint8Array(0);
let lastPic = null;

const u16 = (b, i) => b[i] | (b[i + 1] << 8);

// Same math as the Arduino (rgbToHsv)
function hsv(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const v = mx, s = mx === 0 ? 0 : Math.floor(d * 255 / mx);
  let h = 0;
  if (d !== 0) {
    if (mx === r) h = Math.trunc(60 * (g - b) / d);
    else if (mx === g) h = Math.trunc(60 * (b - r) / d) + 120;
    else h = Math.trunc(60 * (r - g) / d) + 240;
    if (h < 0) h += 360;
  }
  return [h, s, v];
}

function drawGuides() {
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.font = '9px system-ui, sans-serif';
  const top = IGNORE_TOP_ROWS, bottom = H - NEAR_ROWS;
  ctx.strokeStyle = '#00e5ff'; ctx.fillStyle = '#00e5ff';
  ctx.beginPath(); ctx.moveTo(0, top + 0.5); ctx.lineTo(W, top + 0.5); ctx.stroke();
  ctx.fillText('pillars from row ' + top, 2, top - 3);
  if (bottom < H) {
    ctx.strokeStyle = '#ff4fd8'; ctx.fillStyle = '#ff4fd8';
    ctx.beginPath(); ctx.moveTo(0, bottom + 0.5); ctx.lineTo(W, bottom + 0.5); ctx.stroke();
    ctx.fillText('pillars up to row ' + bottom, 2, bottom - 3);
  }
  ctx.strokeStyle = '#ffa500'; ctx.fillStyle = '#ffa500';
  ctx.beginPath(); ctx.moveTo(0, LINE_TOP_ROW + 0.5); ctx.lineTo(W, LINE_TOP_ROW + 0.5); ctx.stroke();
  ctx.fillText('lines from row ' + LINE_TOP_ROW, 2, LINE_TOP_ROW - 3);
  ctx.setLineDash([]);
}

function rowText(v) { return v === 0xFFFF ? '-' : String(v); }

function decodeFrame(b, hdr) {
  const long = hdr === HDR_LONG;
  const pic = b.subarray(hdr, hdr + PIC);
  const mk = b.subarray(hdr + PIC, hdr + PIC + MASK);
  const lk = long ? b.subarray(hdr + PIC + MASK, hdr + PIC + 2 * MASK) : null;
  const found = b[10], color = b[11];
  const L = u16(b, 12), R = u16(b, 14), T = u16(b, 16), B = u16(b, 18);
  const count = u16(b, 20), split = b[22], fps = u16(b, 23) / 10;
  lastPic = pic.slice();                     // the raw picture, for the mouse readout

  const d = img.data;
  for (let i = 0; i < W * H; i++) {
    const o = i * 4;
    if (!showPicture.checked) { d[o] = d[o + 1] = d[o + 2] = 0; d[o + 3] = 255; continue; }
    const p = (pic[2 * i] << 8) | pic[2 * i + 1];
    d[o]     = ((p >> 11) & 31) << 3;
    d[o + 1] = ((p >> 5) & 63) << 2;
    d[o + 2] = (p & 31) << 3;
    d[o + 3] = 255;
  }
  if (showMask.checked) {
    for (let i = 0; i < W * H; i++) {
      const c = (mk[i >> 2] >> ((i & 3) * 2)) & 3;   // 1 red, 2 green (the blocks the car uses)
      if (!c) continue;
      const o = i * 4;
      const tr = c === 1 ? 255 : 0, tg = c === 2 ? 255 : 0;
      d[o]     = 0.5 * d[o]     + 0.5 * tr;
      d[o + 1] = 0.5 * d[o + 1] + 0.5 * tg;
      d[o + 2] = 0.5 * d[o + 2];
    }
  }
  if (long && showLines.checked) {
    for (let i = 0; i < W * H; i++) {
      const c = (lk[i >> 2] >> ((i & 3) * 2)) & 3;   // 1 orange, 2 blue
      if (!c) continue;
      const o = i * 4;
      const col = c === 1 ? [255, 140, 0] : [0, 90, 255];
      d[o]     = 0.4 * d[o]     + 0.6 * col[0];
      d[o + 1] = 0.4 * d[o + 1] + 0.6 * col[1];
      d[o + 2] = 0.4 * d[o + 2] + 0.6 * col[2];
    }
  }
  ctx.putImageData(img, 0, 0);
  if (showIgnore.checked) drawGuides();
  if (found) {
    ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 1;
    ctx.strokeRect(L - 0.5, T - 0.5, R - L + 2, B - T + 2);
  }
  const colorName = found ? (color === 1 ? 'RED' : 'GREEN') : 'none';
  info.textContent =
    `camera ${fps.toFixed(1)} fps | packet ${hdr} bytes | pillar ${colorName} | x ${L}-${R} | rows ${T}-${B} | px ${count}` +
    (split ? ' | split from a bigger blob' : '');
  if (long) {
    // bytes 25..36: orange (found, reason, lowest, centre), blue (found, reason, lowest, centre)
    const o = { f: b[25], r: b[26], low: u16(b, 27), c: u16(b, 29) };
    const bl = { f: b[31], r: b[32], low: u16(b, 33), c: u16(b, 35) };
    const line = (n, l) => `${n}: ${l.f ? 'FOUND' : 'not found'} (${REASON[l.r] || l.r}) | lowest row ${rowText(l.low)} | row straight ahead ${rowText(l.c)}`;
    linesInfo.textContent = line('ORANGE line', o) + '\n' + line('BLUE line  ', bl);
  } else {
    linesInfo.textContent = 'This camera sketch sends the short packet: no floor-line data.';
  }
}

function matchAt(b, i) {
  return i + 3 < b.length && b[i] === MAGIC[0] && b[i + 1] === MAGIC[1] && b[i + 2] === MAGIC[2] && b[i + 3] === MAGIC[3];
}

function findMagic(b) {
  for (let i = 0; i + 3 < b.length; i++) if (matchAt(b, i)) return i;
  return -1;
}

function parse() {
  while (true) {
    const i = findMagic(buf);
    if (i < 0) { buf = buf.slice(Math.max(0, buf.length - 3)); return; }
    if (i > 0) buf = buf.slice(i);
    const shortLen = HDR_SHORT + PIC + MASK, longLen = HDR_LONG + PIC + 2 * MASK;
    if (buf.length < shortLen + 4) return;            // need to see what follows a short packet
    let hdr;
    if (matchAt(buf, shortLen)) hdr = HDR_SHORT;      // next packet starts right after a short one
    else if (buf.length >= longLen + 4 && matchAt(buf, longLen)) hdr = HDR_LONG;
    else if (buf.length < longLen + 4) return;        // wait for more bytes
    else { buf = buf.slice(4); continue; }            // false magic inside the data: skip it
    const len = hdr === HDR_SHORT ? shortLen : longLen;
    decodeFrame(buf, hdr);
    buf = buf.slice(len);
  }
}

async function connect() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    // The ESP32-S3 sends pictures only while the computer says "I am here" (DTR, like the Serial Monitor does)
    await port.setSignals({ dataTerminalReady: true, requestToSend: true });
    reader = port.readable.getReader();
    info.textContent = 'Connected. Waiting for a picture (the sketch needs STREAM_TO_PC = true)...';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const n = new Uint8Array(buf.length + value.length);
      n.set(buf); n.set(value, buf.length);
      buf = n;
      parse();
    }
  } catch (e) {
    info.textContent = 'Error: ' + e.message;
  }
}

cv.addEventListener('mousemove', (e) => {
  if (!lastPic) return;
  const rc = cv.getBoundingClientRect();
  const x = Math.min(W - 1, Math.floor((e.clientX - rc.left) / rc.width * W));
  const y = Math.min(H - 1, Math.floor((e.clientY - rc.top) / rc.height * H));
  const i = y * W + x;
  const p = (lastPic[2 * i] << 8) | lastPic[2 * i + 1];
  const r = ((p >> 11) & 31) << 3, g = ((p >> 5) & 63) << 2, b = (p & 31) << 3;
  const [h, s, v] = hsv(r, g, b);
  pix.textContent = `x ${x} y ${y} | RGB ${r},${g},${b} | H ${h} S ${s} V ${v}`;
});

document.getElementById('connect').addEventListener('click', connect);
</script>
</body>
</html>
